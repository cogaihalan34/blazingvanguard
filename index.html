<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04131b">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#04131b;color:#fff}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Blazing Vanguard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: 9:16 portrait stage. WebGL battlefield; Diablo IV–style HUD: objective tracker top-right, boss bar top,
   bottom action bar with health/resource globes, skill bar and potion belt; full-height sheets for inventory and character. */
:root{
  color-scheme: dark;
  --ink:#080706;        /* page, deepest shadow */
  --char:#11100e;       /* panel fill */
  --iron:#2b2620;       /* frames */
  --bronze:#6f5c43;     /* border line */
  --bronze-hi:#b39466;  /* lit edge */
  --bone:#d9d2c3;       /* primary text */
  --dust:#8a8174;       /* secondary text */
  --blood:#b3241b;      /* health, danger */
  --q-magic:#6e86ff; --q-rare:#f2d64b; --q-set:#3ec46a; --q-unique:#c89b5a;
  --f-head:'Cinzel',Georgia,serif;
  --f-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --f-sc:'Alegreya Sans SC','Alegreya Sans',system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden;background:#000}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(115% 75% at 50% 40%,transparent 50%,rgba(4,3,2,.78) 100%)}
#hurtVig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(110% 80% at 50% 40%,transparent 50%,rgba(160,10,10,.55) 100%)}
#hurtVig.on{animation:hv .5s ease-out}
@keyframes hv{0%{opacity:1}100%{opacity:0}}
#ui{position:absolute;left:0;top:0;width:540px;transform-origin:0 0;pointer-events:none}
#ui *{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:1px solid var(--bronze-hi);outline-offset:2px}

/* D4 frame: thin bronze line, dark fill, small corner diamonds */
.frame{position:relative;background:linear-gradient(180deg,rgba(26,23,20,.96),rgba(12,11,9,.96));border:1px solid var(--bronze);box-shadow:inset 0 0 0 1px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,220,160,.06),0 6px 18px rgba(0,0,0,.6)}
.frame::before,.frame::after{content:'';position:absolute;width:7px;height:7px;background:var(--ink);border:1px solid var(--bronze-hi);transform:rotate(45deg);top:-4px}
.frame::before{left:-4px}.frame::after{right:-4px}

/* ---------- top HUD ---------- */
#tracker{position:absolute;right:14px;top:14px;width:214px;text-align:right;text-shadow:0 1px 3px #000}
#tracker .zone{font-family:var(--f-head);font-weight:700;font-size:14px;letter-spacing:.14em;color:var(--bone);text-transform:uppercase}
#tracker .sub{font-family:var(--f-sc);font-size:11px;letter-spacing:.14em;color:var(--dust);margin-top:2px}
#tracker .sub b{color:var(--bronze-hi);font-weight:700}
#tracker .obj{margin-top:8px;display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:12px;color:var(--bone)}
#tracker .obj::before{content:'';width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--bronze-hi);background:#3a2e20}
#waves{display:flex;gap:4px;justify-content:flex-end;align-items:center;margin-top:6px}
#waves i{width:22px;height:3px;background:#2b2620}
#waves i.done{background:var(--bronze-hi)}
#waves i.now{background:var(--blood);box-shadow:0 0 6px rgba(179,36,27,.8)}
#waves .skull{width:9px;height:9px;transform:rotate(45deg);border:1px solid #6f5c43;margin-left:3px}
#waves .skull.now{background:var(--blood);border-color:#ff5a48}
#bossbar{position:absolute;left:34px;right:34px;top:104px;text-align:center}
#bossbar .bn{font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.2em;color:#e4c9a2;text-transform:uppercase;text-shadow:0 1px 3px #000}
#bossbar .bl{font-family:var(--f-sc);font-size:10px;letter-spacing:.24em;color:var(--q-unique);margin-bottom:3px}
#bossbar .bar{position:relative;height:10px;background:#0c0908;border:1px solid #4a3c2c;box-shadow:0 0 0 1px #000}
#bossbar .bar::before,#bossbar .bar::after{content:'';position:absolute;top:50%;width:11px;height:11px;background:#0c0908;border:1px solid var(--bronze-hi);transform:translateY(-50%) rotate(45deg);z-index:1}
#bossbar .bar::before{left:-8px}#bossbar .bar::after{right:-8px}
#bossbar .bar i{position:absolute;left:0;top:0;bottom:0}
#bossLag{background:#d8c6a0;width:100%;transition:width .6s .25s}
#bossFill{background:linear-gradient(#c8321f,#6e0e08);width:100%}
#bossHpTxt{position:absolute;left:0;right:0;top:12px;font-size:10px;color:var(--dust);letter-spacing:.08em}

/* ---------- combat text (D4: white hits, yellow crits, orange skills, blue crushing) ---------- */
#fx{position:absolute;inset:0;overflow:hidden}
.dmg{position:absolute;font-family:var(--f-body);font-weight:800;white-space:nowrap;line-height:1;transform:translate(-50%,-100%);will-change:transform,opacity;
  color:#f3efe6;-webkit-text-stroke:3px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.dmg.n{font-size:22px}
.dmg.s{font-size:26px;color:#ffb347}
.dmg.c{font-size:32px;color:#ffe14d}
.dmg.c::after{content:' !';color:#ffe14d}
.dmg.cb{font-size:32px;color:#57b6ff}
.dmg.cb::after{content:' ◆';font-size:18px}
.dmg.e{font-size:20px;color:#ff4a3a}
.dmg.m,.dmg.pm{font-family:var(--f-sc);font-size:16px;color:#9a9286;letter-spacing:.06em}
.dmg.blk{font-family:var(--f-sc);font-size:17px;color:#e2c48a;letter-spacing:.1em}
.dmg.lv{font-family:var(--f-head);font-weight:700;font-size:22px;letter-spacing:.2em;color:#f0dcae;-webkit-text-stroke:0;text-shadow:0 0 14px rgba(240,190,90,.7),0 2px 2px #000}
.coinfly{position:absolute;width:12px;height:12px;border-radius:50%;margin:-6px 0 0 -6px;background:radial-gradient(circle at 35% 30%,#fff3c4,#d8a83e 50%,#7a5214);box-shadow:0 0 5px rgba(255,200,80,.7)}
.drop{position:absolute;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;background:rgba(6,5,4,.86);border-left:2px solid var(--dc,#8a8174);white-space:nowrap;font-family:var(--f-body);font-weight:700;font-size:12px;text-shadow:0 1px 1px #000}
.drop img{width:22px;height:22px;object-fit:contain}
#combo{position:absolute;left:16px;top:16px;opacity:0;transition:opacity .25s;font-family:var(--f-sc);text-shadow:0 1px 3px #000}
#combo.on{opacity:1}
#combo b{font-family:var(--f-body);font-weight:800;font-size:30px;color:var(--bone);display:inline-block}
#combo b.bump{animation:bump .16s ease-out}
#combo span{font-size:12px;letter-spacing:.2em;color:var(--dust);margin-left:6px}
@keyframes bump{0%{transform:scale(1.25)}100%{transform:none}}

#banner{position:absolute;left:0;right:0;top:250px;display:flex;justify-content:center;pointer-events:none}
.skillname{display:flex;flex-direction:column;align-items:center;gap:2px;animation:sn 1.4s ease-out forwards}
.skillname .tx{font-family:var(--f-head);font-weight:700;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#efe3c8;text-shadow:0 0 12px var(--c,#b3241b),0 2px 2px #000;display:flex;align-items:center;gap:12px}
.skillname .tx::before,.skillname .tx::after{content:'';width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--bronze-hi))}
.skillname .tx::after{transform:scaleX(-1)}
.skillname .who{font-family:var(--f-sc);font-size:10px;letter-spacing:.3em;color:var(--dust)}
.skillname .rn{display:none}
@keyframes sn{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#cutin{position:absolute;left:0;right:0;top:300px;height:170px;pointer-events:none;overflow:hidden}
.cut{position:absolute;inset:0;animation:cutbg 1.25s cubic-bezier(.2,.8,.2,1) forwards;background:linear-gradient(180deg,transparent,rgba(6,4,3,.88) 22%,rgba(6,4,3,.88) 78%,transparent)}
.cut img{position:absolute;right:20px;top:-30px;height:240px;filter:saturate(.8) drop-shadow(0 0 20px var(--c));animation:cutimg 1.25s cubic-bezier(.2,.8,.2,1) forwards}
.cut .t{position:absolute;left:30px;top:56px;font-family:var(--f-head);font-weight:800;font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:#f3e6c9;text-shadow:0 0 18px var(--c),0 2px 2px #000;animation:cuttx 1.25s ease-out forwards}
.cut .s{position:absolute;left:32px;top:94px;font-family:var(--f-sc);font-size:11px;letter-spacing:.34em;color:var(--bronze-hi);animation:cuttx 1.25s ease-out forwards}
@keyframes cutbg{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes cutimg{0%{transform:translateX(60px);opacity:0}20%{transform:none;opacity:1}80%{opacity:1}100%{transform:translateX(-20px);opacity:0}}
@keyframes cuttx{0%{opacity:0}22%{opacity:1}80%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:var(--f-head);font-size:28px;font-weight:700;color:#e9d7b0;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 0 22px rgba(0,0,0,.9),0 2px 2px #000;opacity:0;pointer-events:none}
#toast small{display:block;font-family:var(--f-sc);font-size:12px;letter-spacing:.32em;color:var(--dust);font-weight:500;margin-top:6px}
#toast::after{content:'';display:block;width:220px;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--bronze-hi),transparent)}
#toast.death{color:#c4261a}
#toast.show{animation:toast 2.6s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:scale(1.06)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#toast2{position:absolute;left:50%;top:470px;transform:translateX(-50%);padding:6px 14px;background:rgba(8,7,6,.9);border:1px solid #3a3026;font-size:12px;color:var(--bone);opacity:0;pointer-events:none;white-space:nowrap}
#toast2.show{animation:toast2 2.2s ease-out forwards}
@keyframes toast2{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* ---------- bottom action bar ---------- */
#panel{position:absolute;left:0;right:0;bottom:0;height:352px;pointer-events:auto;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(8,7,6,0) 0,rgba(8,7,6,.94) 26px,#0b0a08 70px,#080706)}
#panel::before{content:'';position:absolute;left:0;right:0;top:22px;height:1px;background:linear-gradient(90deg,transparent,#5a4a36 15%,#8a7454 50%,#5a4a36 85%,transparent)}
.xprow{position:relative;height:6px;margin:10px 112px 0}
.xpbar{position:absolute;inset:0;background:#0b0908;border:1px solid #3b3127}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7a5a2c,#d6a85a);box-shadow:0 0 6px rgba(214,168,90,.5)}
.hudrow{display:grid;grid-template-columns:120px 1fr 120px;gap:6px;align-items:start;height:222px}
.globe{position:relative;width:120px;height:170px}
.globe .liquid{position:absolute;left:14px;top:30px;width:92px;height:92px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 45%,#140b09,#030202)}
.globe .liquid i{position:absolute;left:0;right:0;bottom:0;height:100%;transition:height .18s;overflow:hidden}
.globe.life .liquid i{background:radial-gradient(120% 90% at 40% 20%,#e0402c,#93150c 45%,#3d0503 100%)}
.globe.mana .liquid i{background:radial-gradient(120% 90% at 40% 20%,#5d76ff,#1b2aa0 45%,#060a3a 100%)}
.globe .liquid i::before{content:'';position:absolute;left:-40%;top:-40%;width:180%;height:180%;background:conic-gradient(from 0deg,rgba(255,255,255,0),rgba(255,255,255,.14),rgba(0,0,0,.2),rgba(255,255,255,.07),rgba(0,0,0,.22),rgba(255,255,255,0));animation:swirl 9s linear infinite;mix-blend-mode:overlay}
.globe .liquid i::after{content:'';position:absolute;left:-5%;right:-5%;top:-3px;height:6px;border-radius:50%;background:rgba(255,220,200,.25)}
@keyframes swirl{to{transform:rotate(360deg)}}
.globe .liquid::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.35),transparent 24%),radial-gradient(circle at 50% 115%,rgba(0,0,0,.55),transparent 55%)}
.globe .gframe{position:absolute;left:-20px;top:0;width:160px;height:152px;pointer-events:none}
.globe .gtx{position:absolute;top:146px;left:0;right:0;text-align:center;font-weight:800;font-size:13px;color:var(--bone);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.globe .glab{position:absolute;top:162px;left:0;right:0;text-align:center;font-family:var(--f-sc);font-size:9px;letter-spacing:.24em;color:var(--dust)}
.center{display:flex;flex-direction:column;gap:6px;min-width:0;padding:6px 12px 0}
.whorow{display:flex;align-items:baseline;gap:8px;height:16px}
.whorow b{font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone)}
.whorow small{font-family:var(--f-sc);font-size:9px;letter-spacing:.18em;color:var(--dust);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whorow span{margin-left:auto;font-family:var(--f-sc);font-size:11px;letter-spacing:.12em;color:var(--bronze-hi);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.slot{position:relative;aspect-ratio:1;padding:0;border:1px solid #4d4031;background:#090807;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 1px #000,inset 0 0 10px rgba(0,0,0,.9)}
.slot img{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:cover;filter:saturate(.85) contrast(1.05)}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(3,2,2,.8) calc(var(--cd,0)*360deg),transparent 0)}
.slot .cdt{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 3px #000}
.slot .rn{position:absolute;right:2px;bottom:2px;min-width:14px;height:14px;padding:0 2px;background:rgba(0,0,0,.85);border:1px solid #4d4031;font-size:9px;line-height:12px;font-weight:800;color:var(--bone);text-align:center}
.slot .mc{position:absolute;left:3px;top:2px;font-size:10px;font-weight:800;color:#8fa2ff;text-shadow:0 1px 2px #000}
.slot.ult{border-color:#8a7454}
.slot.locked img{filter:grayscale(1) brightness(.25)}
.slot.locked .cdt{font-family:var(--f-sc);font-size:11px;color:var(--dust);letter-spacing:.08em}
.slot.nomana img{filter:grayscale(.6) brightness(.45) sepia(.5) hue-rotate(190deg)}
.slot.next{border-color:var(--bronze-hi)}
.slot.next::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--bronze-hi)}
.slot.cast{border-color:#f0dcae;box-shadow:inset 0 0 0 1px #000,0 0 10px rgba(240,200,120,.5)}
.slot.q{border-color:#e08a2c}
.belt{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;height:30px}
.pot{position:relative;border:1px solid #3b3127;background:#0a0908;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 8px rgba(0,0,0,.9)}
.pot img{width:24px;height:24px}
.pot .k{position:absolute;left:3px;top:1px;font-size:8px;color:var(--dust)}
.pot .n{position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:800;color:var(--bone)}
.belt.ping,.mbtn.ping{animation:ping .35s}
@keyframes ping{0%{box-shadow:0 0 0 1px var(--bronze-hi),0 0 12px rgba(214,168,90,.6)}100%{box-shadow:none}}

.bar{display:flex;align-items:stretch;gap:7px;height:58px;margin-top:auto}
.tagcard{flex:1.5;display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;text-align:left;min-width:0}
.tagcard img{width:44px;height:44px;object-fit:cover;border:1px solid var(--bronze);flex:none;filter:saturate(.85)}
.tagcard .tn{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.tagcard .tn b{font-family:var(--f-head);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.tagcard .tn small{font-size:10px;color:var(--dust)}
.tagcard .mini{display:block;height:4px;background:#0b0908;border:1px solid #3b3127;position:relative}
.tagcard .mini i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#c8321f,#6e0e08)}
.tagcard em{font-style:normal;font-family:var(--f-sc);font-weight:800;font-size:11px;letter-spacing:.18em;color:var(--bronze-hi)}
.tagcard .tagcd{position:absolute;left:8px;top:6px;width:44px;height:44px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 3px #000}
.tagcard.cool{opacity:.55}.tagcard.cool img{filter:grayscale(.9)}
.mbtn{width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.mbtn svg{width:24px;height:24px;stroke:var(--bronze-hi);fill:none;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.mbtn span{font-family:var(--f-sc);font-size:9px;letter-spacing:.16em;color:var(--dust)}
.mbtn .badge{position:absolute;right:3px;top:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--blood);color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center;font-style:normal;animation:bdg 1.4s ease-in-out infinite}
@keyframes bdg{50%{box-shadow:0 0 8px rgba(255,80,60,.9)}}
.stats{flex:1.1;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 8px;min-width:0}
.stats .gold{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;color:#e9d29a;font-variant-numeric:tabular-nums}
.stats .gold.bump{animation:gb .25s}
@keyframes gb{0%{color:#fff}100%{color:#e9d29a}}
.ic{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.ic.gold{background:radial-gradient(circle at 35% 30%,#fff3c4,#d8a83e 50%,#7a5214)}
.stats .diff{font-family:var(--f-sc);font-size:9px;letter-spacing:.12em;color:var(--dust);white-space:nowrap}
.stats .diff b{color:var(--bone);font-weight:700}
.stats .diff.d1 b{color:#f0a04a}.stats .diff.d2 b{color:#e0402c}
.stats .dps{font-size:10px;color:var(--dust)}
.stats .dps b{color:#ffb347;font-weight:800}
.togs{display:flex;flex-direction:column;gap:4px;width:50px}
.tog{flex:1;cursor:pointer;font-family:var(--f-sc);font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--dust);background:#0d0b09;border:1px solid #3b3127}
.tog.on{color:#f3e6c9;border-color:var(--bronze-hi);background:linear-gradient(#3a2414,#1c0f08)}

/* ---------- sheets ---------- */
#sheet{position:absolute;left:0;right:0;top:0;bottom:352px;pointer-events:auto;display:flex;flex-direction:column;padding:12px 12px 10px;gap:8px;overflow:auto;
  background:radial-gradient(80% 50% at 50% 30%,rgba(60,40,24,.25),transparent 70%),linear-gradient(180deg,rgba(10,9,8,.97),rgba(8,7,6,.985));border-bottom:1px solid var(--bronze)}
.sh-head{display:flex;align-items:center;gap:6px;padding-bottom:6px;border-bottom:1px solid #2e271f}
.tabs{display:flex;gap:2px}
.tabs button{height:28px;padding:0 10px;border:0;background:none;cursor:pointer;font-family:var(--f-head);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust);border-bottom:2px solid transparent}
.tabs button.on{color:var(--bone);border-bottom-color:var(--blood)}
#whoTabs{display:flex;gap:4px;margin-left:auto}

.cut img{display:block;right:-14px;top:-28px;height:360px;filter:drop-shadow(0 0 18px var(--c)) drop-shadow(0 0 2px #fff);

  transform-origin:50% 100%;animation:cutimg 1.25s cubic-bezier(.2,.8,.2,1) forwards,cutSway 1.25s ease-in-out forwards}
@keyframes cutSway{0%{scale:1.08}100%{scale:1;translate:-12px -4px}}
.cut .t{top:70px}.cut .s{top:108px}
@media (prefers-reduced-motion: reduce){.doll .fig,.doll::after{animation:none}}

/* ---------- environment label, quests, banner, QTE, rift, dialogue ---------- */
#tracker .envl{margin-top:3px;font-weight:900;font-size:12px;color:#d8f4ff;text-shadow:var(--stroke)}
#questHud{position:absolute;right:10px;top:188px;width:206px;padding:6px 8px 8px;pointer-events:none;text-align:right;background:linear-gradient(270deg,rgba(6,30,40,.78),rgba(6,30,40,0));border:0;border-right:3px solid var(--teal-hi);border-radius:0}
#questHud .qh{font-weight:900;font-size:12px;letter-spacing:.08em;color:var(--gold);text-shadow:var(--stroke);text-transform:uppercase}
#questIcon{position:absolute;right:12px;bottom:362px;width:54px;height:54px;padding:0;pointer-events:auto;cursor:pointer;border-radius:12px;border:2px solid #07303d;
  background:#0b3140;box-shadow:inset 0 0 0 1px rgba(160,240,255,.6),0 0 0 2px var(--gold-d),0 4px 10px rgba(0,0,0,.5);overflow:visible}
#questIcon img{display:block;width:100%;height:100%;border-radius:10px}
#questIcon:active{transform:scale(.94)}
#questIcon i{position:absolute;right:-5px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--blood);border:2px solid #fff;animation:bdg 1.4s ease-in-out infinite}
.qi{position:relative;padding:3px 0 5px;transition:opacity .5s,transform .5s}
.qi b{display:block;font-weight:800;font-size:12px;color:#fff;text-shadow:var(--stroke);line-height:1.2}
.qi span{font-weight:900;font-size:12px;color:var(--teal-hi);text-shadow:var(--stroke);font-variant-numeric:tabular-nums}
.qi i{position:absolute;right:0;bottom:1px;height:2px;background:linear-gradient(90deg,transparent,var(--teal-hi));border-radius:1px}
.qi.done b,.qi.done span{color:var(--gold)}
.qi.done{animation:qdone 1.5s ease forwards}
@keyframes qdone{0%{transform:scale(1)}15%{transform:scale(1.08)}70%{opacity:1;transform:none}100%{opacity:0;transform:translateX(30px)}}
#fbanner{position:absolute;left:50%;top:270px;width:290px;transform:translateX(-50%) scale(.2);opacity:0;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
#fbanner[src*="opening"]{width:400px}
#fbanner.on{animation:fban 1.9s steps(24) forwards}
@keyframes fban{0%{opacity:0;transform:translateX(-50%) scale(.2)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1.3)}}
#qte{position:absolute;left:50%;top:420px;width:250px;height:76px;margin-left:-125px;pointer-events:auto;cursor:pointer;border-radius:999px;border:3px solid #ffd8ff;
  background:linear-gradient(180deg,#f9a8ff,#b048e0 45%,#6a1aa8 55%,#8a30c8);box-shadow:0 0 0 3px #2a0640,0 0 30px rgba(220,90,255,.9),inset 0 2px 0 rgba(255,255,255,.6);display:flex;align-items:center;gap:10px;padding:0 14px 0 10px;color:#fff}
#qte.pop{animation:qpop .35s cubic-bezier(.3,1.6,.5,1),qpulse .7s .35s ease-in-out infinite}
@keyframes qpop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes qpulse{50%{box-shadow:0 0 0 3px #2a0640,0 0 46px rgba(255,120,255,1),inset 0 2px 0 rgba(255,255,255,.6)}}
#qte .ring{width:52px;height:52px;flex:none;border-radius:50%;background:conic-gradient(#fff calc(var(--k,1)*360deg),rgba(255,255,255,.18) 0);-webkit-mask:radial-gradient(circle,transparent 15px,#000 16px);mask:radial-gradient(circle,transparent 15px,#000 16px)}
#qte .qx{display:flex;flex-direction:column;align-items:flex-start}
#qte b{font-weight:900;font-size:18px;font-style:italic;text-shadow:var(--stroke)}
#qte small{font-weight:900;font-size:11px;letter-spacing:.2em;color:#ffe9ff;text-shadow:var(--stroke)}
#rift{position:absolute;inset:0;pointer-events:none;opacity:0;background:
  repeating-linear-gradient(0deg,rgba(255,40,90,.25) 0 3px,transparent 3px 11px),radial-gradient(circle at 50% 45%,#fff 0,#e070ff 18%,#30063a 55%,#000 80%)}
#rift.on{animation:riftfx 1.15s ease-in-out}
@keyframes riftfx{0%{opacity:0;transform:scale(1.4) skewX(0)}20%{opacity:1;transform:scale(1) skewX(-6deg)}35%{transform:skewX(8deg)}50%{opacity:1;transform:none;filter:brightness(.2)}100%{opacity:0;filter:brightness(1)}}
#questModal{position:absolute;inset:0;z-index:5;pointer-events:auto;background:rgba(2,14,20,.7);display:flex;align-items:center;justify-content:center;padding:20px}
#questModal .qm{width:100%;max-height:78%;display:flex;flex-direction:column;padding:12px 12px 14px;border-radius:14px!important}
.qm-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid #2c7f93;margin-bottom:8px}
.qm-head b{font-family:var(--f-head);font-weight:900;font-size:22px;color:#fff;text-shadow:var(--stroke)}
#qmClose{width:32px;height:32px;padding:0;border-radius:999px;border:2px solid #07303d;background:var(--btn);color:#fff;font-weight:900;cursor:pointer}
#qmBody{overflow:auto;display:flex;flex-direction:column;gap:8px}
.qrow{padding:9px 10px;border-radius:8px 20px 20px 8px;background:linear-gradient(90deg,#0b2e3c,#16485a);border:1px solid #4fb3c6}
.qrow.done{border-color:var(--gold);box-shadow:0 0 12px rgba(246,215,124,.4)}
.qt b{display:block;font-weight:900;font-size:15px;color:#fff;text-shadow:var(--stroke)}
.qt small{font-weight:800;font-size:12px;color:var(--dust)}
.qbar{position:relative;height:16px;margin:6px 0;border-radius:8px;background:#041219;border:1px solid #02121a;overflow:hidden}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#d6fdff,#58e0f0 45%,#1aa9c4)}
.qbar span{position:absolute;inset:0;text-align:center;font-weight:900;font-size:11px;line-height:14px;color:#fff;text-shadow:var(--stroke)}
.qrw{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;background:#0b3140;border:1px solid #7fe0ef;font-weight:900;font-size:11px;color:#fff}
.chip.gem{color:#f2dcff}.chip .ic{width:9px;height:9px}
.chip.rare{border-color:var(--q-rare);color:var(--q-rare)}.chip.magic{border-color:var(--q-magic);color:#b9c8ff}
.qfoot{text-align:center;font-weight:800;font-size:12px;color:var(--dust);padding-top:4px}.qfoot b{color:var(--gold)}
/* FE: Three Houses dialogue box, re-coloured to the blue palette */
#dlg{position:absolute;left:8px;right:8px;top:104px;height:168px;z-index:2;pointer-events:auto;cursor:pointer;opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s;--who:#7fe0ef}
#dlg.on{opacity:1;transform:none}
#ui.dlgon #questHud,#ui.dlgon #lootFeed{opacity:.15;transition:opacity .3s}
.dlg-body{position:absolute;left:4px;right:84px;top:40px;bottom:6px;border-radius:4px;
  background:radial-gradient(120% 140% at 30% 40%,#f6fbfc 0,#e3eff3 55%,#c9dde5 100%);
  border:3px solid #24586c;box-shadow:inset 0 0 0 2px #8fc4d4,inset 0 0 24px rgba(36,88,108,.25),0 6px 16px rgba(0,0,0,.45);padding:14px 74px 10px 56px}
.dlg-orn{position:absolute;left:-3px;top:-3px;bottom:-3px;width:44px;border-radius:4px 0 0 4px;
  background:linear-gradient(90deg,#1b4a5c,#2d6f86 60%,#24586c);clip-path:polygon(0 0,100% 0,62% 18%,62% 82%,100% 100%,0 100%)}
.dlg-orn::after{content:'';position:absolute;left:8px;top:50%;width:18px;height:18px;margin-top:-9px;transform:rotate(45deg);border:2px solid #f6d77c;box-shadow:0 0 0 3px #1b4a5c,0 0 0 4px #8fc4d4}
#dlgText{margin:0;font-weight:800;font-size:15px;line-height:1.45;color:#10303c;min-height:3em}
.dlg-next{position:absolute;right:12px;bottom:8px;width:14px;height:16px;background:linear-gradient(180deg,#7fe6ef,#2aa6bf);clip-path:polygon(0 0,100% 0,50% 100%);animation:dnext .8s ease-in-out infinite;opacity:0}
#dlg:not(.talk) .dlg-next{opacity:1}
@keyframes dnext{50%{transform:translateY(4px)}}
.dlg-name{position:absolute;left:0;top:10px;height:34px;min-width:190px;padding:0 34px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#2a6a82,#123c4c);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);
  box-shadow:inset 0 0 0 2px #8fc4d4}
.dlg-name::before{content:'';position:absolute;inset:3px 10px;border-top:1px solid rgba(246,215,124,.7);border-bottom:1px solid rgba(246,215,124,.7)}
#dlgName{font-family:var(--f-head);font-weight:900;font-size:16px;color:#fff;text-shadow:var(--stroke)}
.dlg-port{position:absolute;right:6px;top:-4px;width:150px;height:150px}
.dlg-port .dp-in{position:absolute;inset:14px;transform:rotate(45deg);overflow:hidden;border:4px solid #24586c;box-shadow:0 0 0 2px #f6d77c,0 0 0 5px #123c4c,0 0 18px var(--who);
  background:radial-gradient(circle at 50% 30%,#3f8aa2,#123c4c 80%)}
#dlgPort{position:absolute;left:50%;top:50%;width:150%;height:150%;max-width:none;transform:translate(-50%,-46%) rotate(-45deg);transform-origin:50% 50%;animation:pbreathe 3.2s ease-in-out infinite}
#dlg.talk #dlgPort{animation:pbreathe 3.2s ease-in-out infinite,ptalk .18s steps(2) infinite}
#dlg.swap .dp-in{animation:pswap .35s ease-out}
@keyframes pbreathe{0%,100%{scale:1;translate:0 0}50%{scale:1.035;translate:0 -2px}}
@keyframes ptalk{50%{translate:0 -1.5px}}
@keyframes pswap{from{transform:rotate(45deg) scale(.6);opacity:0}to{transform:rotate(45deg) scale(1);opacity:1}}
#sheet{background-image:linear-gradient(180deg,rgba(9,40,54,.94),rgba(4,20,28,.97)),url(sprites/prep_bg.png)!important;background-size:auto,1028px 320px;background-blend-mode:normal}
#loading{background:linear-gradient(180deg,rgba(4,19,27,.6),rgba(4,19,27,.9)),url(sprites/prep_bg.png) center/cover!important;image-rendering:pixelated}
/* spread the plate rows over the full 352px panel */
#panel{gap:11px}
.plate{margin-top:14px;height:42px}
.statbar{height:38px}
.belt{height:38px}
#panel .bar{height:76px}
.togs{gap:3px;width:56px}
.togs .tog{font-size:10px!important;padding:0}
#sndBtn{white-space:nowrap}
</style>

</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="vignette"></div>
  <div id="hurtVig"></div>
  <div id="ui">
    <div id="tracker">
      <div class="zone" id="floorName">Sacae Plains</div>
      <div class="sub">Floor <b id="floorN">1</b> · <span id="diffSub">Normal</span></div>
      <div class="envl" id="envTxt">☀ Day</div>
      <div class="obj" id="objTxt">Rout the enemy</div>
      <div id="waves"></div>
    </div>
    <div id="bossbar" hidden>
      <div class="bl">Unique · Boss</div>
      <div class="bn" id="bossName">Boss</div>
      <div class="bar" style="margin-top:6px"><i id="bossLag"></i><i id="bossFill"></i><span id="bossHpTxt"></span></div>
    </div>
    <div id="fx"></div>
    <div id="purse">
      <span class="gold" id="goldWrap"><i class="ic gold"></i><span id="goldTxt">0</span></span>
      <span class="gem" id="gemWrap"><i class="ic gem"></i><span id="gemTxt">0</span></span>
      <span class="dps">DPS <b id="dpsTxt">0</b></span>
      <span class="diff" id="diffTxt"></span>
    </div>
    <div id="combo"><b id="comboN">0</b><span>HITS</span></div>
    <div id="lootFeed" aria-live="polite"></div>
    <div id="questHud"><div class="qh">Quests</div><div class="ql"></div></div>
    <button type="button" id="questIcon" aria-label="Quest log"><img src="sprites/quest_icon.png" alt=""><i id="questDot" hidden></i></button>
    <img id="fbanner" alt="">
    <button type="button" id="qte" hidden><span class="ring"></span><span class="qx"><b>ENTER THE RIFT</b><small>TAP NOW</small></span></button>
    <div id="dlg" hidden>
      <div class="dlg-body"><div class="dlg-orn"></div><p id="dlgText"></p><span class="dlg-next"></span></div>
      <div class="dlg-name"><span id="dlgName"></span></div>
      <div class="dlg-port"><div class="dp-in"><img id="dlgPort" alt=""></div></div>
    </div>
    <div id="banner"></div>
    <div id="cutin"></div>
    <div id="toast"></div>
    <div id="toast2"></div>
    <div id="panel">
      <div class="plate">
        <div class="pname"><b id="heroName"></b><small id="heroCls"></small></div>
        <div class="pill lvp"><span>LV</span><b id="heroLv"></b></div>
        <div class="pill expp"><span>EXP</span><div class="xpbar"><i id="xpFill"></i></div></div>
      </div>
      <div class="stats2">
        <div class="statbar hp"><span class="lab">HP</span><b id="lifeTx"></b><div class="track" role="img" aria-label="HP"><i id="lifeFill"></i></div></div>
        <div class="statbar sp"><span class="lab">SP</span><b id="manaTx"></b><div class="track" role="img" aria-label="SP"><i id="manaFill"></i></div></div>

      <div class="grid" id="grid"></div>
      <div class="belt" id="belt"></div>

        <button class="tagcard frame" id="tagBtn" type="button"><img id="tagImg" alt=""><span class="tagcd" id="tagCd"></span><span class="tn"><b id="tagName"></b><small id="tagSub"></small><i class="mini"><i id="tagHp"></i></i></span><em>Tag</em></button>
        <button class="mbtn frame" id="charBtn" type="button" aria-label="Character"><svg viewBox="0 0 24 24"><path d="M12 3c-3 0-5 2.2-5 5.2V12l2 2v3h6v-3l2-2V8.2C17 5.2 15 3 12 3z"/><path d="M9.5 9.5h1.8M12.7 9.5h1.8M12 14v3M8 21h8"/></svg><span>Stats</span><i class="badge" id="charBadge" hidden></i></button>
        <button class="mbtn frame" id="invBtn" type="button" aria-label="Inventory"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2M9.5 12h5"/></svg><span>Bag</span><i class="badge" id="invBadge" hidden></i></button>
        <button class="mbtn frame" id="skillBtn" type="button" aria-label="Skills"><svg viewBox="0 0 24 24"><path d="M12 3v5M12 8l-5 5M12 8l5 5M7 13v4M17 13v4"/><circle cx="12" cy="3.5" r="1.6"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/><circle cx="12" cy="8.5" r="1.6"/></svg><span>Skills</span><i class="badge" id="skillBadge" hidden></i></button>
        <button class="mbtn frame" id="shopBtn" type="button" aria-label="Shop"><svg viewBox="0 0 24 24"><path d="M12 3l6 6-6 12-6-12 6-6z"/><path d="M6 9h12M12 3v18"/></svg><span>Shop</span></button>
        <div class="togs"><button class="tog" id="sndBtn" type="button">♪ On</button><button class="tog" id="spdBtn" type="button">×1</button><button class="tog on" id="autoBtn" type="button">Auto</button></div>
      </div>
    </div>
    <div id="sheet" hidden>
      <div class="sh-head"><div class="tabs"><button type="button" data-tab="inv">Bag</button><button type="button" data-tab="char">Stats</button><button type="button" data-tab="skills">Skills</button><button type="button" data-tab="shop">Shop</button></div><div id="whoTabs"></div><button type="button" id="shClose" aria-label="Close">✕</button></div>
      <div id="shBody"></div>
    </div>
    <div id="tip" hidden></div>
    <div id="questModal" hidden><div class="qm frame"><div class="qm-head"><b>Quest Log</b><button type="button" id="qmClose" aria-label="Close">✕</button></div><div id="qmBody"></div></div></div>
    <div id="rift"></div>
    <div id="gacha" hidden><div class="gx-title">Reliquary</div><div class="gx-sub" id="gxSub"></div><div class="gx-grid" id="gxGrid"></div><button type="button" class="tbtn" id="gxClose">Collect</button></div>
  </div>
  <div id="loading"><span class="lt">Blazing Vanguard</span><small id="loadTxt">unrolling the map…</small></div>
</div>
